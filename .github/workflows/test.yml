name: Test

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.gif'

jobs:
  tests-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: runs tests
      run: |
        make test-unit FLAGS="-coverpkg=github.com/webhookx-io/webhookx/... -coverprofile=coverage.txt"
        cat coverage.txt
    - name: uploads coverage reselt
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        flags: unit

  tests-integration-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cache docker images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('test/docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-
      - name: load cached docker images
        if: steps.cache-docker.outputs.cache-hit == 'true' || steps.cache-docker.outputs.cache-matched-key != ''
        run: |
          if [ -f /tmp/docker-cache/images.tar ]; then
            docker load -i /tmp/docker-cache/images.tar
          fi
      - name: pull and cache docker images
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker compose -f test/docker-compose.yml pull
          docker save $(docker compose -f test/docker-compose.yml config --images | sort -u) -o /tmp/docker-cache/images.tar
      - name: starts dependencies
        run: |
          mkdir -p test/output/otel
          sudo chmod 777 -R test/output/otel
          make test-deps
          sleep 3
          docker compose -f test/docker-compose.yml logs
      - name: installs ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      - name: run tests
        run: |
          make test-main FLAGS="-coverpkg=github.com/webhookx-io/webhookx/... --cover --coverprofile=coverage.txt"
          cat coverage.txt
      - name: print webhookx.log
        if: failure()
        run: |
          cat test/webhookx.log
      - name: upload coverage reselt
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: integration

  tests-integration-o11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cache docker images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('test/docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-
      - name: load cached docker images
        if: steps.cache-docker.outputs.cache-hit == 'true' || steps.cache-docker.outputs.cache-matched-key != ''
        run: |
          if [ -f /tmp/docker-cache/images.tar ]; then
            docker load -i /tmp/docker-cache/images.tar
          fi
      - name: pull and cache docker images
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker compose -f test/docker-compose.yml pull
          docker save $(docker compose -f test/docker-compose.yml config --images | sort -u) -o /tmp/docker-cache/images.tar
      - name: starts dependencies
        run: |
          mkdir -p test/output/otel
          sudo chmod 777 -R test/output/otel
          make test-deps
          sleep 3
          docker compose -f test/docker-compose.yml logs
      - name: install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo
      - name: run tests
        run: |
          make test-o11 FLAGS="-coverpkg=github.com/webhookx-io/webhookx/... --cover --coverprofile=coverage.txt"
          cat coverage.txt
      - name: print webhookx.log
        if: failure()
        run: |
          cat test/webhookx.log
      - name: upload coverage reselt
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: integration-o11
